<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>情智兼备的虚拟陪伴系统</title>
    <!-- Tailwind 通过 PostCSS 在构建时注入，见 tailwind.config.js -->
    <style>
      body {
        background: linear-gradient(135deg, #ffeef5 0%, #fff5e6 50%, #ffe4cc 100%);
        color: #4a3a3a;
        min-height: 100vh;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 192, 203, 0.3);
      }
      /* Hide scrollbar for clean UI */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      /* 温馨主题下的文字颜色适配 - 确保在浅色背景下清晰可读 */
      .text-white {
        color: #4a3a3a !important;
      }
      /* Tailwind 透明度类名的覆盖 */
      [class*="text-white/"] {
        color: #4a3a3a !important;
      }
      .text-white\/20 {
        color: rgba(74, 58, 58, 0.4) !important;
      }
      .text-white\/30 {
        color: rgba(74, 58, 58, 0.5) !important;
      }
      .text-white\/40 {
        color: rgba(74, 58, 58, 0.65) !important;
      }
      .text-white\/50 {
        color: rgba(74, 58, 58, 0.75) !important;
      }
      .text-white\/60 {
        color: rgba(74, 58, 58, 0.85) !important;
      }
      .text-white\/70 {
        color: rgba(74, 58, 58, 0.9) !important;
      }
      .text-white\/80 {
        color: rgba(74, 58, 58, 0.95) !important;
      }
      .text-white\/90 {
        color: #4a3a3a !important;
      }
      /* 背景透明度调整 */
      .bg-white\/5 {
        background-color: rgba(255, 255, 255, 0.5) !important;
      }
      .bg-white\/10 {
        background-color: rgba(255, 255, 255, 0.6) !important;
      }
      .bg-white\/15 {
        background-color: rgba(255, 255, 255, 0.7) !important;
      }
      .bg-white\/20 {
        background-color: rgba(255, 255, 255, 0.7) !important;
      }
      /* 边框颜色调整 */
      .border-white\/10 {
        border-color: rgba(255, 192, 203, 0.4) !important;
      }
      .border-white\/20 {
        border-color: rgba(255, 192, 203, 0.5) !important;
      }
      /* 环形边框颜色 */
      .ring-white\/10 {
        --tw-ring-color: rgba(255, 192, 203, 0.4) !important;
      }
      /* 占位符文字颜色 */
      .placeholder-white\/30::placeholder {
        color: rgba(74, 58, 58, 0.5) !important;
      }
      /* 深色背景的元素保持白色文字（如按钮） */
      .bg-black\/40 .text-white,
      .bg-black\/40 .text-white\/50,
      .bg-black\/40 .text-white\/60,
      .bg-black\/40 .text-white\/70,
      .bg-black\/40 .text-white\/80 {
        color: rgba(255, 255, 255, 0.9) !important;
      }
      /* 深色渐变背景的元素 */
      .bg-gradient-to-br.from-slate-900 .text-white,
      .bg-gradient-to-br.from-slate-900 .text-white\/50 {
        color: rgba(255, 255, 255, 0.9) !important;
      }
      /* 渐变按钮文字保持白色 */
      .bg-gradient-to-r .text-white {
        color: white !important;
      }
      /* 语音条波形动画 - 录音时柱状波动，更柔和 */
      @keyframes voiceBar {
        0%, 100% { transform: scaleY(0.35); }
        50% { transform: scaleY(1); }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
    "three": "https://esm.sh/three@0.160.0",
    "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/",
    "three/": "https://esm.sh/three@^0.182.0/"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
