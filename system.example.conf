[key]
; LLM settings, replace with your own provider.
gpt_api_key = YOUR_LLM_API_KEY
gpt_base_url = https://YOUR_LLM_BASE_URL/v1
gpt_model_engine = YOUR_MODEL_NAME

; Speech recognition. Use ali/local/none according to deployment.
ASR_mode = none
ali_nls_key_id =
ali_nls_key_secret =
ali_nls_app_key =
local_asr_ip = 127.0.0.1
local_asr_port = 10096

; Text-to-speech module. This project uses VoxCPM2.
tts_module = voxcpm2

; Public backend URL used by frontend/mobile app.
fay_url = http://YOUR_SERVER_IP:19500

; Optional settings.
proxy_config =
ltp_mode = none
start_mode = web
hunyuan3d_api_url = http://localhost:8081

; Optional emotion APIs.
baidu_emotion_app_id =
baidu_emotion_api_key =
baidu_emotion_secret_key =

; Other TTS providers kept for compatibility.
ali_tss_key_id =
ali_tss_key_secret =
ali_tss_app_key =
ms_tts_key =
ms_tts_region =
volcano_tts_appid =
volcano_tts_access_token =
volcano_tts_cluster =
volcano_tts_voice_type =
